services:
  - type: web
    name: ultimate-pos
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: "Ultimate POS"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          type: web
          name: ultimate-pos
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: ultimate-pos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ultimate-pos-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ultimate-pos-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ultimate-pos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ultimate-pos-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr

databases:
  - name: ultimate-pos-db
    plan: free
    databaseName: ultimate_pos
    user: ultimate_pos
